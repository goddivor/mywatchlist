name: Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (yyyy.m.n format)'
        required: true
        type: string

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Generate JSON serialization models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env file
        run: |
          echo "MAL_CLIENT_ID=${{ secrets.MAL_CLIENT_ID }}" >> assets/.env
          echo "MAL_CLIENT_SECRET=${{ secrets.MAL_CLIENT_SECRET }}" >> assets/.env
          echo "ANILIST_CLIENT_ID=${{ secrets.ANILIST_CLIENT_ID }}" >> assets/.env
          echo "ANILIST_CLIENT_SECRET=${{ secrets.ANILIST_CLIENT_SECRET }}" >> assets/.env
          echo "SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}" >> assets/.env
          echo "SIMKL_CLIENT_SECRET=${{ secrets.SIMKL_CLIENT_SECRET }}" >> assets/.env
          echo "APP_CONFIG_URL=${{ secrets.APP_CONFIG_URL }}" >> assets/.env
          echo "BUILD_VARIANT=github" >> assets/.env
          echo "API_URL=${{ secrets.API_URL }}" >> assets/.env
          echo "API_SECRET=${{ secrets.API_SECRET }}" >> assets/.env
          echo "ERROR_REPORT_URL=${{ secrets.ERROR_REPORT_URL }}" >> assets/.env

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Get version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK files
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/MyWatchList-v${VERSION}-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/MyWatchList-v${VERSION}-arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/MyWatchList-v${VERSION}-x86_64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/MyWatchList-v${VERSION}-universal.apk

      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum *.apk > checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -1)

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" --no-merges)
            COMPARE_TEXT="Initial release"
          else
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"%s" --no-merges)
            COMPARE_TEXT="Changes since ${PREVIOUS_TAG}"
          fi

          # Group commits by conventional commit type
          FEATURES=$(echo "$COMMITS" | grep -E "^feat:" | sed 's/^feat: //' | sed 's/^/- /' || true)
          FIXES=$(echo "$COMMITS" | grep -E "^fix:" | sed 's/^fix: //' | sed 's/^/- /' || true)
          REFACTORS=$(echo "$COMMITS" | grep -E "^refactor:" | sed 's/^refactor: //' | sed 's/^/- /' || true)
          STYLES=$(echo "$COMMITS" | grep -E "^style:" | sed 's/^style: //' | sed 's/^/- /' || true)
          DOCS=$(echo "$COMMITS" | grep -E "^docs:" | sed 's/^docs: //' | sed 's/^/- /' || true)
          CHORES=$(echo "$COMMITS" | grep -E "^chore:" | sed 's/^chore: //' | sed 's/^/- /' || true)
          TESTS=$(echo "$COMMITS" | grep -E "^test:" | sed 's/^test: //' | sed 's/^/- /' || true)

          # Build the full release body
          {
            echo "## MyWatchList ${{ steps.version.outputs.version }}"
            echo ""
            echo "> ${COMPARE_TEXT}"
            echo ""
            echo "---"
            echo ""
            echo "## Changelog"
            echo ""

            if [ -n "$FEATURES" ]; then
              echo "### New Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$REFACTORS" ]; then
              echo "### Refactoring"
              echo "$REFACTORS"
              echo ""
            fi
            if [ -n "$STYLES" ]; then
              echo "### Style"
              echo "$STYLES"
              echo ""
            fi
            if [ -n "$DOCS" ]; then
              echo "### Documentation"
              echo "$DOCS"
              echo ""
            fi
            if [ -n "$CHORES" ]; then
              echo "### Chores"
              echo "$CHORES"
              echo ""
            fi
            if [ -n "$TESTS" ]; then
              echo "### Tests"
              echo "$TESTS"
              echo ""
            fi

            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$REFACTORS" ] && [ -z "$STYLES" ] && [ -z "$DOCS" ] && [ -z "$CHORES" ] && [ -z "$TESTS" ]; then
              echo "See commit history for detailed changes."
              echo ""
            fi

            echo "---"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Variant | Description |"
            echo "|---------|-------------|"
            echo "| \`arm64-v8a\` | Most modern Android devices (64-bit ARM) |"
            echo "| \`armeabi-v7a\` | Older Android devices (32-bit ARM) |"
            echo "| \`x86_64\` | Android emulators and x86 devices |"
            echo "| \`universal\` | Works on all devices (larger file size) |"
            echo ""
            echo "### Verification"
            echo ""
            echo "Verify your download with \`checksums.txt\`:"
            echo "\`\`\`bash"
            echo "sha256sum -c checksums.txt"
            echo "\`\`\`"
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/checksums.txt
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_body.md
          generate_release_notes: true
          append_body: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: release-artifacts/*.apk
          retention-days: 30
