name: Release Build

# A release is a tag named yyyy.m.n (year, month without leading zero, counter in the month),
# e.g. 2026.10.1. Running the workflow by hand with a version creates that tag on the chosen commit.
on:
  push:
    tags:
      - '20*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (yyyy.m.n, e.g. 2026.10.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          tools/release/version.sh check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the version into pubspec.yaml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The bump is never committed back, so the Android versionCode is derived from the tag
          # (yy*10000 + m*100 + n): monotonic across releases, independent of the committed pubspec.
          CODE=$(tools/release/version.sh code "$VERSION")
          FULL=$(tools/release/version.sh set "$VERSION" "$CODE")
          echo "Building $FULL"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Create assets/.env
        # assets/.env is git-ignored but declared as an asset: the file must exist. Secrets that are
        # not configured give empty values (the build passes, the trackers will not sign in).
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          APP_CONFIG_URL: ${{ secrets.APP_CONFIG_URL }}
          API_URL: ${{ secrets.API_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ERROR_REPORT_URL: ${{ secrets.ERROR_REPORT_URL }}
        run: |
          mkdir -p assets
          {
            echo "MAL_CLIENT_ID=$MAL_CLIENT_ID"
            echo "MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET"
            echo "ANILIST_CLIENT_ID=$ANILIST_CLIENT_ID"
            echo "ANILIST_CLIENT_SECRET=$ANILIST_CLIENT_SECRET"
            echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"
            echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET"
            echo "APP_CONFIG_URL=$APP_CONFIG_URL"
            echo "BUILD_VARIANT=github"
            echo "API_URL=$API_URL"
            echo "API_SECRET=$API_SECRET"
            echo "ERROR_REPORT_URL=$ERROR_REPORT_URL"
          } > assets/.env
          if [ -z "$MAL_CLIENT_ID" ]; then
            echo "::warning::Tracker secrets are not configured: assets/.env holds empty placeholders."
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate localization files
        # The generated S class is a build output (not in git): tools/l10n/build.sh, never flutter gen-l10n.
        run: tools/l10n/build.sh

      - name: Generate JSON serialization models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Flutter analyzer
        run: flutter analyze

      - name: Prepare Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$STORE"
          else
            # android/app/build.gradle signs the release build with android/key.properties. Without the
            # owner's keystore, use a throwaway one so the build passes. Such an APK cannot update an
            # install signed with another key.
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: signing with a throwaway key."
            KEYSTORE_PASSWORD="mwl-throwaway"
            KEY_PASSWORD="mwl-throwaway"
            KEY_ALIAS="throwaway"
            keytool -genkeypair -keystore "$STORE" -storetype PKCS12 -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=MyWatchList CI" \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD"
          fi
          {
            echo "storeFile=$STORE"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build APK (universal)
        run: flutter build apk --release

      - name: Collect APKs and SHA1 checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          OUT=build/app/outputs/flutter-apk
          mkdir -p release-artifacts
          cp "$OUT/app-armeabi-v7a-release.apk" "release-artifacts/MyWatchList-v${VERSION}-armeabi-v7a.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "release-artifacts/MyWatchList-v${VERSION}-arm64-v8a.apk"
          cp "$OUT/app-x86_64-release.apk" "release-artifacts/MyWatchList-v${VERSION}-x86_64.apk"
          cp "$OUT/app-release.apk" "release-artifacts/MyWatchList-v${VERSION}-universal.apk"
          cd release-artifacts
          for apk in *.apk; do
            sha1sum "$apk" > "$apk.sha1"
          done
          ls -l

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tools/release/changelog.sh "$VERSION" > release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha1
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            release-artifacts/*.apk
            release-artifacts/*.sha1
          retention-days: 30
