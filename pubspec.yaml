name: mywatchlist
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2026.10.1+1

environment:
  sdk: ^3.6.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Material/Widgets/Cupertino translations and RTL for the S locales (main.dart).
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.1
  smooth_page_indicator: ^1.2.0+3
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_phoenix: ^1.1.1
  line_icons: ^2.0.3
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  url_launcher: ^6.3.1
  app_links: ^6.3.3
  flutter_custom_tabs: ^2.1.0
  flutter_web_auth_2: ^4.0.1
  equatable: ^2.0.7
  flutter_bloc: ^9.0.0
  awesome_dialog: ^3.2.1
  photo_view: ^0.15.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  path: ^1.9.0
  dio: ^5.8.0+1
  share_plus: ^10.1.4
  shimmer: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  html: ^0.15.5
  html_unescape: ^2.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  uuid: ^4.5.1
  scroll_to_index: ^3.0.1
  fluttertoast: ^9.0.0
  youtube_player_flutter: ^9.1.1
  flutter_dotenv: ^5.2.1
  animated_text_kit: ^4.2.2
  connectivity_plus: ^6.1.4
  retry: ^3.1.2
  flutter_widget_from_html_core: ^0.15.2
  mwl_api:
    path: mwl-api
  mwl_commons:
    path: mwl-api/mwl_commons

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10

  # Added by deps-prefs-contract for the queued DailyAL units (pins checked against
  # Flutter 3.35.6 / Dart 3.9.2: newer majors need Dart 3.10+).
  flutter_local_notifications: ^20.1.0 # notifications
  timezone: ^0.10.1 # notifications (scheduled), airing times
  dynamic_color: ">=1.8.1 <1.9.0" # theme (Material You colours); 1.9+ needs AGP 9, 2.x a newer material_color_utilities
  flex_color_picker: ^3.7.2 # theme, stats chart colours
  translator_plus: ^1.0.1 # synopsis auto-translation
  package_info_plus: ^9.0.1 # about page, in-app updater
  device_info_plus: ^12.4.0 # updater (ABI), tablet layout, Android version checks
  add_2_calendar: ^3.0.1 # add airing episodes to the device calendar
  open_filex: ^5.0.0 # in-app updater (open the downloaded APK)
  flutter_displaymode: ^0.7.0 # high refresh rate on Android
  graphview: ^1.5.1 # relation graph
  fl_chart: ^1.3.0 # stats charts
  workmanager: ^0.9.2 # MAL hub polling while the app is closed (Android WorkManager)
  workmanager_platform_interface: 0.9.3 # pinned: workmanager_apple 0.9.4 does not compile against 0.9.4 (Flutter 3.35 cannot take apple >=0.9.5)

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  # Code generation for the @JsonSerializable models (`dart run build_runner build`).
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/mwl-black-bg.png"
  # The Android adaptive icon (layers + XML in the mipmap-* folders) is built by
  # tools/icon/extract.sh: flutter_launcher_icons would write its layers into
  # drawable-*, which this unit does not own. This block keeps the legacy
  # ic_launcher.png (Android < 8) and the square iOS icon.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    # Explore category and genre pictures from DailyAL (MIT, credited in the licences page).
    - assets/images/explore/
    - assets/animes/
    - assets/.env

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    # MyDubList status glyphs (dubbed / partially dubbed), used by the dub badge.
    - family: DubStatus
      fonts:
        - asset: assets/fonts/MyDubListIcons.ttf
